<main>
<header><span class="brand">KOMA / 工作进度</span><div class="header-tools"><span id="connection"><span class="dot"></span>正在读取本地工作单…</span><label class="theme-control"><span>外观</span><select id="theme" aria-label="页面外观"><option value="auto">自动</option><option value="light">浅色</option><option value="dark">深色</option></select></label></div></header>
<div id="content"><section class="panel">正在加载进度记录。</section></div>
<footer><span>每 3 秒读取当前工作单 · 页面连接正常不代表任务正在执行</span><a href="/work-order" target="_blank" rel="noopener">完整工作单 ↗</a></footer>
</main>
<script>

const expandedRecords=new Set();

const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};

function rememberDetails(details,key){details.open=expandedRecords.has(key);details.addEventListener('toggle',()=>{if(details.open)expandedRecords.add(key);else expandedRecords.delete(key)})}

}

const stageLabel={needs_work:'待解决',verification:'待验证',accepted:'已完成',unclassified:'阶段待确认'};

function timestamp(value){const parsed=Date.parse(value??'');return Number.isFinite(parsed)?parsed:0}
function issueTimes(d){
 const events=new Map();
 // Link per-issue events by their stable IDs. Bulk bookkeeping such as numbering
 // stays in the timeline without making the affected issues look newly updated.
 for(const event of d.timeline||[]){
  const at=timestamp(event.at);
  if(!at||event.affectsActivity===false)continue;
  for(const id of event.itemIds??[event.itemId]){
   if(!id)continue;
   const previous=events.get(id);
   events.set(id,{first:Math.min(previous?.first??at,at),last:Math.max(previous?.last??at,at)});
  }

  const history=events.get(issue.id);
  const reported=timestamp(issue.reportedAt),registered=timestamp(issue.registeredAt);
  const reportedDay=reported?0:timestamp(`${issue.reportedDate}T00:00:00+08:00`);
  const earliest=[timestamp(issue.firstEvidenceAt),history?.first??0].filter(Boolean);
  const firstRecord=earliest.length?Math.min(...earliest):0;
  const exactActivity=Math.max(reported,registered,firstRecord,history?.last??0,
   timestamp(issue.updatedAt),timestamp(issue.reopenedAt),timestamp(issue.closedAt));
  return [issue.id,{
   reported,reportedDay,registered,
   submitted:reported||reportedDay||registered||firstRecord,
   activity:Math.max(exactActivity,reportedDay),
   activityIsDayOnly:reportedDay>exactActivity,
  }];
 }));
}
function workTimeline(d){

  .filter(e=>e.at&&Number.isFinite(Date.parse(e.at))).sort((a,b)=>Date.parse(b.at)-Date.parse(a.at));

 for(const event of records){
  const row=el('li',null,'timeline-entry '+(event.kind==='verified'?'verified':'')),time=el('time',date(event.at).replace(/:\d\d$/,''));time.dateTime=event.at;time.title=date(event.at);
  row.append(time,el('strong',event.title));if(event.detail)row.append(el('p',event.detail));list.append(row);

 const f=document.createDocumentFragment(),hero=el('section');hero.append(badge('当前工作进度 · '+d.state),el('h1',d.title),el('p',d.outcome,'muted'),el('p','共 '+d.items.length+' 项 · 待解决 '+(counts.needs_work||0)+' · 待验证 '+(counts.verification||0)+(counts.unclassified?' · 阶段待确认 '+counts.unclassified:'')+' · 已完成 '+(counts.accepted||0),'small muted'),el('p','各阶段总数包含等待外部条件和用户搁置；等待原因是附加标记，不是另一种处理阶段。','small muted'),el('p','最近更新：'+date(d.updatedAt),'small muted'));const stale=el('p',null);stale.id='stale';hero.append(stale);f.append(hero);

 const grid=el('div',null,'grid'),queue=panel('工作事项');queue.append(el('p','按实际能力记录；不以测试数量或提交数量计算完成比例。','small muted'));

  const count=d.items.filter(g=>matchesFilter(g,key,conditionFilter)).length;
  const button=el('button',label+' · '+count,'badge '+(queueFilter===key?'accepted':'pending'));button.type='button';button.setAttribute('aria-pressed',String(queueFilter===key));
  button.onclick=()=>{queueFilter=key;render(data)};filters.append(button);

  const button=el('button',label,'badge '+(conditionFilter===key?'accepted':'pending'));button.type='button';button.setAttribute('aria-pressed',String(conditionFilter===key));
  button.onclick=()=>{conditionFilter=key;render(data)};conditions.append(button);
 }

  const option=el('option',title);option.value=value;sortSelect.append(option);

  if(time.activity)t.append(el('div','最近活动：'+(time.activityIsDayOnly?`${g.reportedDate}（仅记录日期）`:date(time.activity))));

 content.replaceChildren(f);const timelineBody=document.querySelector('.timeline-body');if(timelineBody)timelineBody.scrollTop=timelineScroll;tick();
}
function tick(){if(!data)return;const age=Math.max(0,Math.floor((Date.now()-Date.parse(data.updatedAt))/60000)),stale=document.querySelector('#stale');if(stale){stale.style.display=age>=15?'block':'none';stale.textContent='已 '+age+' 分钟没有实质进度更新。以上是最后一次记录，不能据此认定工作仍在执行。'}for(const g of data.items){const group=queueGroup(g),closed=group==='accepted'&&g.closedAt;const n=document.querySelector('[data-elapsed="'+g.id+'"]'),start=g.reportedAt||g.firstEvidenceAt,end=closed?g.closedAt:new Date().toISOString();if(n)n.textContent=(g.reportedAt?'提出后经过：':'最早记录后经过：')+(start?duration((Date.parse(end)-Date.parse(start))/1000):'未核实')+(closed?' · 这项已完成':group==='accepted'?' · 已完成（未记录完成时间）':' · '+(stageLabel[group]||'阶段待确认'));if(g.handling){const n=document.querySelector('[data-effort="'+g.id+'"]'),h=g.handling,until=h.activeUntil?Date.parse(h.activeUntil):0,active=h.activeSince?Math.max(0,(Math.min(Date.now(),until)-Date.parse(h.activeSince))/1000):0;if(n)n.textContent=Number.isFinite(h.recordedSeconds)?(h.measurement||'本次记录处理')+'：'+duration(h.recordedSeconds+active)+(h.activeSince?(Date.now()>until?' · 记录已到期，等待更新':' · 此前工时未知'):' · 分段记录已结束，早期工时未知'):'实际处理工时：未知（此前未分段记录）'}}}
async function refresh(){if(inFlight)return;inFlight=true;try{const r=await fetch('/api/progress',{cache:'no-store',signal:AbortSignal.timeout(6000)});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.schemaVersion!==1||!Array.isArray(d.items))throw Error('工作单格式不完整');lastSuccess=Date.now();const key=JSON.stringify({...d,servedAt:null});data=d;if(key!==lastKey){render(d);lastKey=key}connection.replaceChildren(el('span',null,'dot'),el('span','已连接 · '+date(new Date(lastSuccess).toISOString())))}catch(e){connection.textContent='读取失败 · '+e.message+(lastSuccess?' · 保留上次记录':'');}finally{inFlight=false}}
refresh();setInterval(refresh,3000);setInterval(tick,1000);
</script>
