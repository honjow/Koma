name: Build OHOS

on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-ohos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build_hap:
    name: Build unsigned Release HAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/honjow/harmonyos-build-env:26.0-api26
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: Koma
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: Koma
          submodules: recursive
          persist-credentials: false

      - name: Configure Git workspace ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/Koma"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/Koma/third_party/reader-kit"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/Koma/third_party/lexbor"

      - name: Sync reader-kit from main
        run: git submodule update --remote --checkout -- third_party/reader-kit

      - name: Check release preflight
        run: bash scripts/check_release_preflight.sh

      - name: Install native build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential xxd pkg-config curl ca-certificates patch perl python3 zstd

      - name: Identify native build toolchain
        id: native_toolchain
        run: |
          native_sdk="$OHOS_SDK_HOME/native"
          identity="$(sha256sum /etc/os-release /usr/bin/cc /usr/bin/c++ \
            "$native_sdk/oh-uni-package.json" "$native_sdk/build/cmake/ohos.toolchain.cmake" \
            "$native_sdk/llvm/bin/clang" | sha256sum | cut -d ' ' -f 1)"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # These directories contain only pinned, public native dependencies.
      # The recipes also check their own SDK and architecture identities.
      - name: Restore native dependency cache
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Koma/.hvigor/avif-deps
            Koma/.hvigor/archive-deps
            Koma/.hvigor/source-browser-http
            Koma/.hvigor/icu-regex-*
          key: koma-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native_toolchain.outputs.identity }}-${{ hashFiles('Koma/scripts/prepare-reader-avif.sh', 'Koma/scripts/prepare-comic-archive.sh', 'Koma/scripts/prepare-source-browser-http.sh', 'Koma/scripts/prepare-icu-regex.sh', 'Koma/scripts/icu-regex-data-filter.json') }}

      - name: Install OHPM dependencies
        run: ohpm install --all

      - name: Build unsigned HAP (release)
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon

      - name: Inspect and collect HAP
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import zipfile

          source = Path("entry/build/default/outputs/default/entry-default-unsigned.hap")
          with zipfile.ZipFile(source) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("HAP archive integrity check failed")
              app = json.loads(archive.read("module.json"))["app"]
              if app["bundleName"] != "com.honjow.koma":
                  raise SystemExit("Unexpected HAP bundle name")
              if app.get("buildMode") != "release" or app.get("debug") is not False:
                  raise SystemExit("Expected a non-debug Release HAP")
              required = {
                  "libs/arm64-v8a/libkoma_source_runtime.so",
                  "libs/arm64-v8a/libc++_shared.so",
              }
              if not required.issubset(archive.namelist()):
                  raise SystemExit("HAP is missing required arm64 native libraries")

          version = app["versionName"]
          if re.fullmatch(r"[A-Za-z0-9._-]+", version) is None:
              raise SystemExit("Invalid artifact version")
          output = Path(f"Koma_{version}_ohos-release-unsigned.hap")
          shutil.copyfile(source, output)
          manifest = {
              "commit": os.environ["GITHUB_SHA"],
              "readerKitCommit": subprocess.check_output(
                  ["git", "-C", "third_party/reader-kit", "rev-parse", "HEAD"], text=True
              ).strip(),
              "bundleName": app["bundleName"],
              "versionName": version,
              "versionCode": app["versionCode"],
              "buildMode": app["buildMode"],
              "signed": False,
              "hap": output.name,
              "bytes": output.stat().st_size,
          }
          Path("build-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"HAP_PATH=Koma/{output}\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload unsigned HAP
        uses: actions/upload-artifact@v4
        with:
          name: ohos-hap-unsigned
          path: |
            ${{ env.HAP_PATH }}
            Koma/build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Save native dependency cache
        if: github.ref == 'refs/heads/master' && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Koma/.hvigor/avif-deps
            Koma/.hvigor/archive-deps
            Koma/.hvigor/source-browser-http
            Koma/.hvigor/icu-regex-*
          key: ${{ steps.native_cache.outputs.cache-primary-key }}

  publish:
    name: Publish tagged Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build_hap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged release notes
        uses: actions/checkout@v4

      - name: Download verified Release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ohos-hap-unsigned
          path: release-artifacts

      - name: Verify tag, artifact version and release notes
        run: python3 scripts/check_release_notes.py --tag "$GITHUB_REF_NAME" --manifest release-artifacts/build-manifest.json --github-env

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: release-artifacts/*.hap,release-artifacts/build-manifest.json
          artifactErrorsFailBuild: true
          prerelease: ${{ endsWith(github.ref_name, 'pre') }}
          makeLatest: ${{ endsWith(github.ref_name, 'pre') && 'false' || 'true' }}
          bodyFile: ${{ env.RELEASE_NOTES_PATH }}
          allowUpdates: true
          replacesArtifacts: true
